version: "3.8"

services:
  # Backend: Spring Data REST application
  backend:
    image: udlepsi/spring-template:latest
    # Alternatively, you can build from local Spring project
    # build: ../spring-template
    container_name: spring-template
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    volumes:
      - ./spring-template-data:/data  # Optional: for persistent data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/users"]
      interval: 10s
      timeout: 5s
      retries: 5
    # depends_on is not needed since we'll start both manually

  # Frontend: Next.js client application
  frontend:
    build: .
    container_name: planbe-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8080
      - API_BASE_URL=http://localhost:8080
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./:/app  # Live reload during development (optional)

# Optional: Add a PostgreSQL database if needed
# volumes:
#   postgres-data:
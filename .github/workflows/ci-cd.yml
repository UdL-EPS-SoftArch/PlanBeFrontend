name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize runs on the same ref; do NOT cancel in-progress runs so that
# a queued production deployment is never dropped mid-flight.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Start Spring backend (spring-template image)
        run: |
          docker run -d --name backend -p 8080:8080 udlepssoftarch/spring-template:latest
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://127.0.0.1:8080; then
              echo "Backend is up"
              exit 0
            fi
            sleep 2
          done
          docker logs backend
          exit 1
      - name: Build Next.js application
        run: npm run build
      - name: Start Next.js server
        run: |
          npm start &
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://localhost:3000; then
              echo "Next.js is up"
              exit 0
            fi
            sleep 2
          done
          echo "Next.js failed to start"
          exit 1
      - name: Run E2E tests (Cucumber + Playwright)
        run: npm run test:e2e:ci
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - name: Stage Playwright Report for Pages
        if: github.ref == 'refs/heads/main'
        run: mkdir -p pages-site/reports && cp playwright-report/results.html pages-site/reports/
      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./pages-site

  deploy-vercel:
    if: success() && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Deploy to Vercel (production)
        run: npx vercel@latest deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-pages:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0

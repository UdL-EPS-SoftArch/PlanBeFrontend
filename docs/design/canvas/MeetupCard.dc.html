<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tarjeta de quedada</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<a href="Detalle.dc.html" style="display: flex; flex-direction: column; gap: 16px; width: 100%; height: 100%; box-sizing: border-box; padding: 20px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E7E5E0; box-shadow: 0 1px 2px rgba(22,24,29,0.04); text-decoration: none; color: #16181D; font-family: 'Inter', system-ui, sans-serif">
  <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
    <div style="width: 60px; height: 64px; border-radius: 12px; background: #FDEBE4; color: #9A3412; display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0">
      <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 24px; line-height: 1">{{ c.day }}</span>
      <span style="font-weight: 600; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; margin-top: 4px">{{ c.month }}</span>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end">
      <span style="padding: 4px 10px; border-radius: 8px; background: #F5F5F3; color: #4A4F5A; font-weight: 600; font-size: 12px">{{ c.category }}</span>
      <span style="{{ c.statusStyle }}">{{ c.statusLabel }}</span>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 8px">
    <h3 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 20px; line-height: 1.25; letter-spacing: -0.01em">{{ c.title }}</h3>
    <span style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #4A4F5A"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>{{ c.when }}</span>
    <span style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #4A4F5A"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>{{ c.place }}</span>
  </div>
  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; font-size: 13px"><span style="font-weight: 600">{{ c.spotsText }}</span><span style="color: #6B7080">{{ c.capacityText }}</span></div>
      <div style="height: 6px; border-radius: 999px; background: #F0EEEA; overflow: hidden"><div style="{{ c.barStyle }}"></div></div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; padding-top: 12px; border-top: 1px solid #F0EEEA">
      <span style="width: 28px; height: 28px; border-radius: 999px; background: #16181D; color: #FFFFFF; font-weight: 700; font-size: 11px; display: inline-flex; align-items: center; justify-content: center">{{ c.initials }}</span>
      <span style="font-size: 13px; color: #4A4F5A">Organiza <span style="color: #16181D; font-weight: 600">{{ c.org }}</span></span>
    </div>
  </div>
</a>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"item":{"editor":null},"$preview":{"width":360,"height":400}}'>
class Component extends DCLogic {
  renderVals() {
    const it = this.props.item ?? {
      title: 'Ruta en bici por La Mitjana', category: 'Deporte', day: '13', month: 'dic',
      when: 'Sáb · 10:30 – 13:00', place: 'Seu Vella, Lleida', taken: 8, total: 12,
      status: 'open', org: 'Pau Serra', initials: 'PS',
    };
    const tones = {
      open: ['Abierta', '#E0F2F0', '#0F5F58', '#0F766E'],
      full: ['Completa', '#FEF3C7', '#8A3F07', '#B45309'],
      cancelled: ['Cancelada', '#FDE8E8', '#991B1B', '#B91C1C'],
      finished: ['Finalizada', '#F5F5F3', '#4A4F5A', '#8A8F99'],
    };
    const t = tones[it.status] ?? tones.open;
    const free = Math.max(0, it.total - it.taken);
    const pct = Math.min(100, Math.round((it.taken / it.total) * 100));
    return {
      c: {
        ...it,
        statusLabel: t[0],
        statusStyle: `padding: 4px 10px; border-radius: 999px; background: ${t[1]}; color: ${t[2]}; font-weight: 600; font-size: 12px`,
        barStyle: `height: 100%; width: ${pct}%; border-radius: 999px; background: ${t[3]}`,
        spotsText: it.status === 'full' ? 'Lista de espera abierta' : (free === 1 ? 'Queda 1 plaza' : `Quedan ${free} plazas`),
        capacityText: `${it.taken}/${it.total}`,
      },
    };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>PlanBe · Crear quedada</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; min-height: 100vh; background: #F5F5F3; color: #16181D; font-family: 'Inter', system-ui, sans-serif; display: flex; flex-direction: column">
  <dc-import name="Navbar" active="quedadas" logged="{{ yes }}" hint-size="100%,72px"></dc-import>

  <main style="flex: 1; max-width: 800px; width: 100%; margin: 0 auto; box-sizing: border-box; padding: 40px 20px 72px; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <a href="Quedadas.dc.html" style="align-self: flex-start; color: #4A4F5A; font-weight: 500; font-size: 14px; text-decoration: none; padding: 6px 0">← Volver a quedadas</a>
      <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 40px; letter-spacing: -0.025em">Crear quedada</h1>
      <span style="font-size: 15px; color: #4A4F5A">Los campos con * son obligatorios.</span>
    </div>

    <form style="display: flex; flex-direction: column; gap: 20px">
      <fieldset style="margin: 0; border: 1px solid #E7E5E0; border-radius: 18px; background: #FFFFFF; padding: 24px; display: flex; flex-direction: column; gap: 18px">
        <legend style="padding: 0 6px; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 18px">El plan</legend>
        <div style="display: flex; flex-direction: column; gap: 8px"><label for="c-t" style="font-weight: 600; font-size: 14px">Título *</label><input id="c-t" value="Ruta en bici por La Mitjana" style="height: 44px; box-sizing: border-box; padding: 0 14px; border: 1px solid #D6D3CC; border-radius: 10px; font: 400 15px 'Inter', sans-serif"></div>
        <div style="display: flex; flex-direction: column; gap: 8px"><label for="c-d" style="font-weight: 600; font-size: 14px">Descripción</label><textarea id="c-d" rows="4" style="box-sizing: border-box; padding: 12px 14px; border: 1px solid #D6D3CC; border-radius: 10px; font: 400 15px 'Inter', sans-serif; resize: vertical">Salimos desde la Seu Vella y bajamos hasta La Mitjana a ritmo tranquilo.</textarea></div>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px">
          <div style="display: flex; flex-direction: column; gap: 8px"><label for="c-c" style="font-weight: 600; font-size: 14px">Categoría *</label><select id="c-c" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #D6D3CC; border-radius: 10px; background: #FFFFFF; font: 400 15px 'Inter', sans-serif; color: #16181D"><option>Deporte</option></select></div>
          <div style="display: flex; flex-direction: column; gap: 8px"><span id="c-v" style="font-weight: 600; font-size: 14px">Visibilidad *</span>
            <div role="radiogroup" aria-labelledby="c-v" style="display: flex; padding: 4px; border-radius: 12px; background: #F5F5F3; gap: 4px">
              <sc-for list="{{ vis }}" as="v" hint-placeholder-count="3">
                <button type="button" role="radio" aria-checked="{{ v.checked }}" onClick="{{ v.pick }}" style="{{ v.style }}">{{ v.label }}</button>
              </sc-for>
            </div>
          </div>
        </div>
        <sc-if value="{{ isGroup }}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-direction: column; gap: 8px"><label for="c-g" style="font-weight: 600; font-size: 14px">Grupo *</label><select id="c-g" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #D6D3CC; border-radius: 10px; background: #FFFFFF; font: 400 15px 'Inter', sans-serif; color: #16181D"><option>Ciclistas de Lleida</option></select><span style="font-size: 13px; color: #6B7080">Solo los miembros del grupo podrán verla.</span></div>
        </sc-if>
      </fieldset>

      <fieldset style="margin: 0; border: 1px solid #E7E5E0; border-radius: 18px; background: #FFFFFF; padding: 24px; display: flex; flex-direction: column; gap: 18px">
        <legend style="padding: 0 6px; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 18px">Cuándo y cuántos</legend>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px">
          <div style="display: flex; flex-direction: column; gap: 8px"><label for="c-s" style="font-weight: 600; font-size: 14px">Empieza *</label><input id="c-s" type="datetime-local" value="2026-12-13T10:30" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #D6D3CC; border-radius: 10px; font: 400 15px 'Inter', sans-serif"></div>
          <div style="display: flex; flex-direction: column; gap: 8px"><label for="c-e" style="font-weight: 600; font-size: 14px">Termina *</label><input id="c-e" type="datetime-local" value="2026-12-13T09:00" aria-invalid="true" aria-describedby="c-e-err" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1.5px solid #B91C1C; border-radius: 10px; font: 400 15px 'Inter', sans-serif"><span id="c-e-err" style="font-size: 13px; font-weight: 500; color: #B91C1C">Tiene que ser después del inicio.</span></div>
          <div style="display: flex; flex-direction: column; gap: 8px"><label for="c-n" style="font-weight: 600; font-size: 14px">Plazas *</label><input id="c-n" type="number" min="1" value="12" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #D6D3CC; border-radius: 10px; font: 400 15px 'Inter', sans-serif"></div>
        </div>
      </fieldset>

      <fieldset style="margin: 0; border: 1px solid #E7E5E0; border-radius: 18px; background: #FFFFFF; padding: 24px; display: flex; flex-direction: column; gap: 18px">
        <legend style="padding: 0 6px; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 18px">Dónde</legend>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px">
          <div style="display: flex; flex-direction: column; gap: 8px"><label for="c-a" style="font-weight: 600; font-size: 14px">Lugar o dirección *</label><input id="c-a" value="Seu Vella" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #D6D3CC; border-radius: 10px; font: 400 15px 'Inter', sans-serif"></div>
          <div style="display: flex; flex-direction: column; gap: 8px"><label for="c-ci" style="font-weight: 600; font-size: 14px">Ciudad *</label><input id="c-ci" value="Lleida" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #D6D3CC; border-radius: 10px; font: 400 15px 'Inter', sans-serif"></div>
        </div>
      </fieldset>

      <details style="border: 1px solid #E7E5E0; border-radius: 18px; background: #FFFFFF; padding: 20px 24px">
        <summary style="cursor: pointer; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 18px; min-height: 28px">Opciones avanzadas <span style="font-family: 'Inter', sans-serif; font-weight: 500; font-size: 14px; color: #6B7080">· edad, género, precio y repetición</span></summary>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; padding-top: 18px">
          <div style="display: flex; flex-direction: column; gap: 8px"><label for="c-min" style="font-weight: 600; font-size: 14px">Edad mín.</label><input id="c-min" type="number" value="18" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #D6D3CC; border-radius: 10px; font: 400 15px 'Inter', sans-serif"></div>
          <div style="display: flex; flex-direction: column; gap: 8px"><label for="c-max" style="font-weight: 600; font-size: 14px">Edad máx.</label><input id="c-max" type="number" value="45" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #D6D3CC; border-radius: 10px; font: 400 15px 'Inter', sans-serif"></div>
          <div style="display: flex; flex-direction: column; gap: 8px"><label for="c-gen" style="font-weight: 600; font-size: 14px">Para</label><select id="c-gen" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #D6D3CC; border-radius: 10px; background: #FFFFFF; font: 400 15px 'Inter', sans-serif; color: #16181D"><option>Todos</option></select></div>
          <div style="display: flex; flex-direction: column; gap: 8px"><label for="c-p" style="font-weight: 600; font-size: 14px">Precio (€)</label><input id="c-p" type="number" min="0" value="0" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #D6D3CC; border-radius: 10px; font: 400 15px 'Inter', sans-serif"></div>
          <div style="display: flex; flex-direction: column; gap: 8px"><label for="c-r" style="font-weight: 600; font-size: 14px">Se repite</label><select id="c-r" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #D6D3CC; border-radius: 10px; background: #FFFFFF; font: 400 15px 'Inter', sans-serif; color: #16181D"><option>No</option><option>Cada semana</option></select></div>
        </div>
      </details>

      <div style="display: flex; flex-wrap: wrap; gap: 12px; justify-content: flex-end; padding-top: 4px">
        <a href="Quedadas.dc.html" style="height: 48px; padding: 0 20px; border-radius: 10px; color: #16181D; font-weight: 600; font-size: 15px; text-decoration: none; display: inline-flex; align-items: center">Cancelar</a>
        <a href="Detalle.dc.html" style="height: 48px; padding: 0 24px; border-radius: 10px; background: #C2410C; color: #FFFFFF; font-weight: 700; font-size: 15px; text-decoration: none; display: inline-flex; align-items: center">Publicar quedada</a>
      </div>
    </form>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1700}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { vis: 'public' }; }
  renderVals() {
    const base = 'flex: 1; height: 38px; border: none; border-radius: 9px; font: 500 14px Inter, sans-serif; cursor: pointer;';
    const vis = [['public', 'Pública'], ['private', 'Privada'], ['group', 'Grupo']].map(([id, label]) => ({
      label,
      checked: this.state.vis === id ? 'true' : 'false',
      pick: () => this.setState({ vis: id }),
      style: this.state.vis === id ? base + ' background: #FFFFFF; color: #16181D; font-weight: 600; box-shadow: 0 1px 2px rgba(22,24,29,0.1);' : base + ' background: transparent; color: #4A4F5A;',
    }));
    return { yes: true, vis, isGroup: this.state.vis === 'group' };
  }
}
</script>
</body>
</html>
